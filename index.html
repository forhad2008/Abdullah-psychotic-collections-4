<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Collection Page 4 | Abdullah Psychotic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
:root{
  --bg:#050505;
  --card:#11110f;
  --text:#f4f2ec;
  --muted:#8f8d87;
  --line:rgba(255,255,255,.10);
  --accent:#a8040f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

/* PAGE */
.collection-page{
  width:min(1400px,100%);
  margin:auto;
  padding:30px 24px 70px;
}

/* TOP PROFILE */
.collection-head{
  display:flex;
  align-items:center;
  gap:17px;
  margin:18px 0 34px;
}

.profile-link{
  flex:0 0 auto;
  width:82px;
  height:82px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.25);
  background:#151515;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.profile-link img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.profile-info{
  min-width:0;
  text-align:left;
}

.profile-name{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:25px;
  line-height:1.1;
  font-weight:600;
  letter-spacing:-.5px;
}

.verified{
  width:18px;
  height:18px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#6c7ff2;
  color:#050505;
  font-size:10px;
}

.profile-subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.profile-actions{
  margin-left:auto;
}

.follow-btn{
  border:0;
  background:#3b3b38;
  color:#fff;
  padding:14px 24px;
  border-radius:30px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:.25s ease;
}

.follow-btn:hover{
  background:#fff;
  color:#000;
  transform:translateY(-2px);
}

/* COLLECTION NAV */
.collection-nav{
  display:flex;
  gap:38px;
  border-bottom:1px solid var(--line);
  margin-bottom:28px;
}

.collection-nav button{
  position:relative;
  border:0;
  background:transparent;
  color:#8d8b85;
  padding:0 0 17px;
  font-family:'Montserrat',sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
}

.collection-nav button.active{
  color:#fff;
}

.collection-nav button.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:#fff;
}

/* INTRO */
.collection-intro{
  margin-bottom:24px;
  text-align:left;
}

.collection-intro h1{
  font-family:'Cinzel',serif;
  font-size:clamp(23px,3vw,34px);
  font-weight:500;
  letter-spacing:2px;
}

.collection-intro p{
  margin-top:7px;
  max-width:700px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
  letter-spacing:.4px;
}

/* 33 IMAGE GRID */
.collection-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.collection-card{
  position:relative;
  overflow:hidden;
  aspect-ratio:4/5;
  background:var(--card);
  border-radius:22px;
  cursor:pointer;
  isolation:isolate;
}

.collection-card::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.82) 0%,
    rgba(0,0,0,.08) 43%,
    transparent 70%
  );
  pointer-events:none;
}

.collection-card a{
  display:block;
  width:100%;
  height:100%;
}

.collection-card img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:
    transform .7s cubic-bezier(.2,.7,.2,1),
    filter .5s ease;
}

.collection-card:hover img{
  transform:scale(1.055);
  filter:brightness(.88);
}

.card-number{
  position:absolute;
  z-index:3;
  top:12px;
  left:12px;
  min-width:40px;
  height:31px;
  padding:0 7px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(8px);
  font-size:9px;
  letter-spacing:1px;
}

.card-info{
  position:absolute;
  z-index:3;
  left:16px;
  right:12px;
  bottom:15px;
  text-align:left;
}

.card-name{
  font-family:'Cinzel',serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.card-caption{
  margin-top:4px;
  color:#c4c1ba;
  font-size:9px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.card-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  color:#fff;
  font-size:8px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  opacity:.82;
}

.card-link i{
  font-size:8px;
}

/* PAGINATION */
.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:30px;
}

.pagination a{
  min-width:38px;
  height:38px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  border-radius:10px;
  background:#11110f;
  color:#8f8d87;
  font-family:'Montserrat',sans-serif;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:.25s ease;
}

.pagination a:hover,
.pagination a.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

/* FOOTER */
.collection-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:#77756f;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* TABLET / MOBILE */
@media(max-width:850px){

  .collection-page{
    padding:22px 12px 45px;
  }

  .collection-head{
    margin-top:10px;
    margin-bottom:25px;
  }

  .profile-link{
    width:66px;
    height:66px;
  }

  .profile-name{
    font-size:20px;
  }

  .profile-subtitle{
    font-size:8px;
    letter-spacing:2.2px;
  }

  .follow-btn{
    padding:11px 18px;
    font-size:11px;
  }

  .collection-nav{
    gap:25px;
  }

  .collection-nav button{
    font-size:10px;
  }

  .collection-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .collection-card{
    border-radius:15px;
  }

  .card-info{
    left:11px;
    bottom:11px;
  }

  .card-name{
    font-size:10px;
    letter-spacing:.8px;
  }

  .card-caption{
    font-size:7px;
    letter-spacing:.8px;
  }

  .card-link{
    font-size:7px;
    margin-top:5px;
  }

  .pagination{
    margin-top:22px;
    gap:6px;
  }

  .pagination a{
    min-width:34px;
    height:34px;
    font-size:10px;
    padding:0 9px;
  }

  .card-number{
    top:8px;
    left:8px;
    min-width:34px;
    height:25px;
    padding:0 5px;
    font-size:7px;
  }
}

@media(max-width:430px){

  .profile-actions{
    display:none;
  }

  .profile-name{
    font-size:19px;
  }

  .collection-grid{
    gap:6px;
  }

  .collection-card{
    border-radius:13px;
  }

  .collection-intro h1{
    font-size:22px;
  }

  .collection-footer{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }
}

</style>
</head>

<body>

<main class="collection-page">

  <!-- PROFILE HEADER -->
  <header class="collection-head">

    <a
      class="profile-link"
      href="https://forhad2008.github.io/Abdullah-psychotic/"
      aria-label="Abdullah Psychotic home"
    >
      <img src="pro.webp" alt="Abdullah Psychotic">
    </a>

    <div class="profile-info">
      <div class="profile-name">
        <span>Abdullah Psychotic</span>
        <span class="verified">
          <i class="fas fa-check"></i>
        </span>
      </div>

      <div class="profile-subtitle">
        Collection
      </div>
    </div>

    <div class="profile-actions">
      <button class="follow-btn" id="followBtn">
        Follow
      </button>
    </div>

  </header>

  <!-- COLLECTION NAV -->
  <nav class="collection-nav" aria-label="Collection navigation">
    <button class="active" data-filter="all">Created</button>
    <button data-filter="saved">Popular</button>
  </nav>

  <!-- INTRO -->
  <section class="collection-intro">
    <h1>THE FOURTH CHAPTER</h1>

    <p>
      The fourth chapter of the Abdullah Psychotic archive —
      experimental designs, rare silhouettes, rebellious fashion
      and new creative visions.
    </p>
  </section>

  <!-- COLLECTION GRID -->
  <section
    id="collectionGrid"
    class="collection-grid"
    aria-label="Abdullah Psychotic collection"
  ></section>

  <!-- PAGINATION: ONLY 1, 3, 4 -->
  <div class="pagination" aria-label="Collection pages">

    <a href="https://forhad2008.github.io/Abdullah-psychotic-collections/">
      1
    </a>

    <a href="https://forhad2008.github.io/Abdullah-psychotic-collections-3/">
      3
    </a>

    <a href="index.html" class="active">
      4
    </a>

  </div>

  <!-- FOOTER -->
  <div class="collection-footer">
    <span id="collectionCount">33 designs · 101—133</span>
    <span>Abdullah Psychotic © 2026</span>
  </div>

</main>

<script>

/*
=========================================================
 ABDULLAH PSYCHOTIC — COLLECTION PAGE 4

 TOTAL DESIGNS: 33

 IMAGE ORDER:
 101.webp
 102.webp
 103.webp
 ...
 133.webp

 CARD NUMBERS:
 101 TO 133
=========================================================
*/

const collectionItems = Array.from(
  { length: 33 },
  (_, index) => {

    const number = index + 101;

    return {
      name: `Design ${number}`,
      caption: "Abdullah Psychotic",
      image: `${number}.webp`,
      link: `${number}.webp`,
      saved: true
    };

  }
);


/* ELEMENTS */
const grid = document.getElementById("collectionGrid");
const count = document.getElementById("collectionCount");
const filterButtons = document.querySelectorAll(
  ".collection-nav button"
);


/* CREATE ONE CARD */
function createCollectionCard(item, index){

  const number = index + 101;

  return `
    <article class="collection-card">

      <a
        href="${item.link}"
        aria-label="Open ${item.name}"
      >

        <img
          src="${item.image}"
          alt="${item.name}"
          loading="${index < 6 ? "eager" : "lazy"}"
          onerror="this.style.opacity='.25'"
        >

        <span class="card-number">
          ${number}
        </span>

        <div class="card-info">

          <div class="card-name">
            ${item.name}
          </div>

          <div class="card-caption">
            ${item.caption}
          </div>

          <span class="card-link">
            View design
            <i class="fas fa-arrow-right"></i>
          </span>

        </div>

      </a>

    </article>
  `;
}


/* RENDER COLLECTION */
function renderCollection(mode = "all"){

  const visibleItems =
    mode === "saved"
      ? collectionItems.filter(item => item.saved)
      : collectionItems;

  grid.innerHTML = visibleItems
    .map((item, index) =>
      createCollectionCard(item, index)
    )
    .join("");

  count.textContent =
    `${visibleItems.length} designs · 101—133`;
}


/* COLLECTION BUTTONS */
filterButtons.forEach(button => {

  button.addEventListener("click", () => {

    filterButtons.forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");

    renderCollection(button.dataset.filter);

  });

});


/* FOLLOW BUTTON */
const followBtn = document.getElementById("followBtn");

let followed = false;

followBtn.addEventListener("click", () => {

  followed = !followed;

  followBtn.textContent =
    followed
      ? "Following"
      : "Follow";

});


/* START PAGE 4 */
renderCollection("all");

</script>

</body>
</html>
